<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#315b7f"/></marker></defs>
<rect width="1200" height="690" fill="#fbfcfe"/>
<style>text { font-family:Arial,sans-serif; fill:#17324d; font-size:18px } .node { fill:#e7f1fa; stroke:#315b7f; stroke-width:2 } .edge { stroke:#315b7f;stroke-width:2;fill:none;marker-end:url(#arrow) } .small {font-size:15px}</style>
<text x="30" y="35" font-size="24">Authored digital Colab adaptation: diffusion, CFG and custom blue guidance</text>
<text class="small" x="30" y="62">Maps the source paper/whiteboard interlude and following guidance code; no physical drawing or learner participation claimed.</text>
<rect class="node" x="30" y="110" width="170" height="85" rx="10"/><text x="45" y="143">Current latent z_t</text><text class="small" x="45" y="172">seeded initial noise</text>
<rect class="node" x="265" y="95" width="210" height="115" rx="10"/><text x="280" y="125">UNet at timestep t</text><text class="small" x="280" y="152">unconditional + prompt</text><text class="small" x="280" y="177">frozen noise predictions</text>
<rect class="node" x="535" y="95" width="275" height="115" rx="10"/><text x="550" y="125">Classifier-free guidance</text><text class="small" x="550" y="152">epsilon = epsilon_u</text><text class="small" x="550" y="177">+ s (epsilon_text - epsilon_u)</text>
<path class="edge" d="M200 152 L265 152"/><path class="edge" d="M475 152 L535 152"/>
<rect class="node" x="870" y="95" width="280" height="115" rx="10"/><text x="885" y="127">Normal LMS scheduler step</text><text class="small" x="885" y="153">uses current latent + epsilon</text><text class="small" x="885" y="180">repeat across native timesteps</text>
<path class="edge" d="M810 152 L870 152"/>
<path class="edge" d="M1010 210 L1010 270 L115 270 L115 195"/><text class="small" x="450" y="258">next latent z_(t-1)</text>
<rect class="node" x="535" y="320" width="275" height="90" rx="10"/><text x="550" y="352">Predicted clean latent</text><text class="small" x="550" y="380">z_0 = z_t - sigma_t * epsilon</text>
<path class="edge" d="M672 210 L672 320"/>
<rect class="node" x="535" y="455" width="275" height="85" rx="10"/><text x="550" y="487">Differentiable VAE decode</text><text class="small" x="550" y="515">decode(z_0 / 0.18215) / 2 + .5</text>
<path class="edge" d="M672 410 L672 455"/>
<rect class="node" x="870" y="455" width="280" height="85" rx="10"/><text x="885" y="487">Scaled blue loss</text><text class="small" x="885" y="515">a * mean(abs(blue - 0.9))</text>
<path class="edge" d="M810 498 L870 498"/>
<rect class="node" x="870" y="320" width="280" height="90" rx="10"/><text x="885" y="352">Gradient wrt current latent</text><text class="small" x="885" y="380">z_t := z_t - sigma_t^2 * grad</text>
<path class="edge" d="M1010 455 L1010 410"/>
<path class="edge" d="M1115 320 L1170 320 L1170 225 L1100 225 L1100 210"/>
<text class="small" x="35" y="345">Custom guidance occurs every 5 steps</text><text class="small" x="35" y="370">in the original blue-loss demonstration.</text>
<text class="small" x="35" y="404">Noise predictions are treated as frozen</text><text class="small" x="35" y="429">for this gradient; it flows through the</text><text class="small" x="35" y="454">clean-latent estimate and VAE decoder.</text>
<text class="small" x="35" y="570">After the last scheduler step, VAE decode produces the saved output image.</text>
<text class="small" x="35" y="605">The controlled sweeps preserve seed/input/model/scheduler and record actual images; this diagram contains no generated result.</text>
<text class="small" x="35" y="641">Source: fast.ai course22p2 diffusion-nbs / stable_diffusion_deep_dive.ipynb (paper interlude + guidance cells).</text>
</svg>